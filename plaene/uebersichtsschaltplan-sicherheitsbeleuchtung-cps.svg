<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Blattrand -->
  <rect x="20" y="20" width="1360" height="860" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Titel -->
  <text x="700" y="52" text-anchor="middle" font-size="19" font-weight="bold">ÜBERSICHTSSCHALTPLAN – SICHERHEITSBELEUCHTUNGSANLAGE (ZENTRALBATTERIESYSTEM CPS)</text>
  <text x="700" y="72" text-anchor="middle" font-size="11.5" fill="#555555">schematische Darstellung, ohne Maßstab · DIN EN 50171 · DIN EN 50172 · DIN VDE 0108-100 · DIN EN 1838</text>

  <!-- ================= Netzeinspeisung ================= -->
  <line x1="165" y1="95" x2="165" y2="138" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="180" y="108" font-size="11.5">Netzeinspeisung 3/N/PE ~ 400/230 V, 50 Hz</text>

  <!-- NSHV -->
  <rect x="60" y="140" width="210" height="110" fill="#f8f9fa" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="165" y="175" text-anchor="middle" font-size="14" font-weight="bold">NSHV</text>
  <text x="165" y="195" text-anchor="middle" font-size="11">Niederspannungs-Hauptverteilung</text>
  <text x="165" y="212" text-anchor="middle" font-size="11">Allgemeinversorgung (AV)</text>

  <!-- Zuleitung NSHV -> CPS -->
  <line x1="270" y1="212" x2="428" y2="212" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="336" y1="221" x2="350" y2="203" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="343" y="198" text-anchor="middle" font-size="10">3/N/PE</text>
  <text x="343" y="234" text-anchor="middle" font-size="10" fill="#555555">Zuleitung CPS, Funktionserhalt E30</text>

  <!-- AV-Abgang zu Unterverteilern -->
  <line x1="165" y1="250" x2="165" y2="558" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="158" y1="405" x2="172" y2="391" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="178" y="402" font-size="10" fill="#555555">AV-Verteilung</text>

  <!-- UV Allgemeinbeleuchtung -->
  <rect x="60" y="560" width="210" height="90" fill="#f8f9fa" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="165" y="585" text-anchor="middle" font-size="12" font-weight="bold">Unterverteiler</text>
  <text x="165" y="602" text-anchor="middle" font-size="11">Allgemeinbeleuchtung</text>
  <text x="165" y="618" text-anchor="middle" font-size="11">mit 3-Ph-Netzüberwachung</text>
  <text x="165" y="633" text-anchor="middle" font-size="11">(Netzwächter)</text>
  <text x="165" y="670" text-anchor="middle" font-size="10" font-style="italic" fill="#555555">weitere UV analog …</text>

  <!-- ================= CPS-Anlage ================= -->
  <rect x="430" y="140" width="340" height="430" fill="#eef4fb" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="600" y="161" text-anchor="middle" font-size="14" font-weight="bold">Zentralbatterieanlage (CPS)</text>
  <text x="600" y="177" text-anchor="middle" font-size="10.5" fill="#555555">nach DIN EN 50171, Aufstellung im eigenen Brandabschnitt</text>

  <!-- Ladeteil -->
  <rect x="460" y="185" width="130" height="55" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="525" y="208" text-anchor="middle" font-size="11.5" font-weight="bold">Ladeteil /</text>
  <text x="525" y="226" text-anchor="middle" font-size="11.5" font-weight="bold">Gleichrichter</text>

  <!-- Umschalteinrichtung -->
  <rect x="620" y="185" width="120" height="55" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="680" y="208" text-anchor="middle" font-size="11.5" font-weight="bold">Umschaltung</text>
  <text x="680" y="226" text-anchor="middle" font-size="10.5">AV / SV (autom.)</text>

  <!-- Batterie -->
  <rect x="460" y="270" width="130" height="75" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="525" y="290" text-anchor="middle" font-size="11.5" font-weight="bold">Batterie</text>
  <text x="525" y="306" text-anchor="middle" font-size="10">z. B. 216 V DC, OGiV</text>
  <text x="525" y="320" text-anchor="middle" font-size="10">wartungsfrei</text>
  <text x="525" y="334" text-anchor="middle" font-size="10">Nennbetriebsdauer 1 h</text>

  <!-- Steuerung -->
  <rect x="460" y="375" width="130" height="75" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="525" y="395" text-anchor="middle" font-size="11.5" font-weight="bold">Steuerung &amp;</text>
  <text x="525" y="410" text-anchor="middle" font-size="11.5" font-weight="bold">Überwachung</text>
  <text x="525" y="426" text-anchor="middle" font-size="10">autom. Funktions- und</text>
  <text x="525" y="440" text-anchor="middle" font-size="10">Betriebsdauertest</text>

  <!-- Endstromkreisabgänge -->
  <rect x="620" y="375" width="120" height="75" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="680" y="398" text-anchor="middle" font-size="11" font-weight="bold">Endstromkreis-</text>
  <text x="680" y="413" text-anchor="middle" font-size="11" font-weight="bold">abgänge</text>
  <text x="680" y="431" text-anchor="middle" font-size="10">abgesichert ≤ 6 A</text>

  <!-- interne Verbindungen -->
  <line x1="430" y1="212" x2="460" y2="212" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="590" y1="212" x2="620" y2="212" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="525" y1="240" x2="525" y2="268" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <polyline points="590,307 650,307 650,242" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="700" y1="240" x2="700" y2="373" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ================= Endstromkreise ================= -->
  <!-- SK 1: Rettungszeichenleuchten -->
  <polyline points="740,390 790,390 790,330 1180,330" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="1180" y1="330" x2="1235" y2="330" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="2 5"/>
  <text x="800" y="312" font-size="11">SK 1 – Rettungszeichenleuchten, Dauerschaltung (DS)</text>
  <g>
    <rect x="892" y="319" width="36" height="22" rx="2" fill="#1a7f37" stroke="#145c28"/>
    <rect x="896" y="328.5" width="12" height="3" fill="#ffffff"/>
    <polygon points="920,330 908,324 908,336" fill="#ffffff"/>
    <rect x="972" y="319" width="36" height="22" rx="2" fill="#1a7f37" stroke="#145c28"/>
    <rect x="976" y="328.5" width="12" height="3" fill="#ffffff"/>
    <polygon points="1000,330 988,324 988,336" fill="#ffffff"/>
    <rect x="1052" y="319" width="36" height="22" rx="2" fill="#1a7f37" stroke="#145c28"/>
    <rect x="1056" y="328.5" width="12" height="3" fill="#ffffff"/>
    <polygon points="1080,330 1068,324 1068,336" fill="#ffffff"/>
  </g>
  <text x="1245" y="334" font-size="10" font-style="italic" fill="#555555">max. 20 Leuchten</text>

  <!-- SK 2: Sicherheitsleuchten BS -->
  <polyline points="740,412 810,412 810,430 1180,430" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="1180" y1="430" x2="1235" y2="430" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="2 5"/>
  <text x="820" y="410" font-size="11">SK 2 – Sicherheitsleuchten Rettungsweg, Bereitschaftsschaltung (BS)</text>
  <g stroke="#1a1a1a" stroke-width="1.5" fill="#ffffff">
    <circle cx="910" cy="430" r="12"/>
    <line x1="901.5" y1="421.5" x2="918.5" y2="438.5"/>
    <line x1="901.5" y1="438.5" x2="918.5" y2="421.5"/>
    <circle cx="910" cy="430" r="3.5" fill="#1a1a1a"/>
    <circle cx="990" cy="430" r="12"/>
    <line x1="981.5" y1="421.5" x2="998.5" y2="438.5"/>
    <line x1="981.5" y1="438.5" x2="998.5" y2="421.5"/>
    <circle cx="990" cy="430" r="3.5" fill="#1a1a1a"/>
    <circle cx="1070" cy="430" r="12"/>
    <line x1="1061.5" y1="421.5" x2="1078.5" y2="438.5"/>
    <line x1="1061.5" y1="438.5" x2="1078.5" y2="421.5"/>
    <circle cx="1070" cy="430" r="3.5" fill="#1a1a1a"/>
  </g>
  <text x="1245" y="434" font-size="10" font-style="italic" fill="#555555">max. 20 Leuchten</text>

  <!-- SK 3: Sicherheitsleuchten DS -->
  <polyline points="740,434 795,434 795,530 1180,530" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="1180" y1="530" x2="1235" y2="530" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="2 5"/>
  <text x="820" y="510" font-size="11">SK 3 – Antipanik-/Sicherheitsbeleuchtung, Dauerschaltung (DS)</text>
  <g stroke="#1a1a1a" stroke-width="1.5" fill="#ffffff">
    <circle cx="910" cy="530" r="12"/>
    <line x1="901.5" y1="521.5" x2="918.5" y2="538.5"/>
    <line x1="901.5" y1="538.5" x2="918.5" y2="521.5"/>
    <circle cx="990" cy="530" r="12"/>
    <line x1="981.5" y1="521.5" x2="998.5" y2="538.5"/>
    <line x1="981.5" y1="538.5" x2="998.5" y2="521.5"/>
    <circle cx="1070" cy="530" r="12"/>
    <line x1="1061.5" y1="521.5" x2="1078.5" y2="538.5"/>
    <line x1="1061.5" y1="538.5" x2="1078.5" y2="521.5"/>
  </g>
  <text x="1245" y="534" font-size="10" font-style="italic" fill="#555555">max. 20 Leuchten</text>

  <text x="795" y="575" font-size="10.5" font-style="italic" fill="#555555">weitere Endstromkreise je nach Gebäudegröße …</text>

  <!-- ================= Meldetableau ================= -->
  <rect x="950" y="120" width="240" height="80" fill="#f8f9fa" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="1070" y="145" text-anchor="middle" font-size="12" font-weight="bold">Meldetableau / Fernanzeige</text>
  <text x="1070" y="163" text-anchor="middle" font-size="10.5">Betrieb – Störung – Batteriebetrieb</text>
  <text x="1070" y="180" text-anchor="middle" font-size="10">an ständig überwachter Stelle (z. B. Pforte)</text>

  <!-- Meldeleitung Steuerung -> Tableau -->
  <polyline points="460,412 350,412 350,90 1070,90 1070,118" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="700" y="84" text-anchor="middle" font-size="10" fill="#666666">Melde-/Busleitung zum Tableau</text>

  <!-- Meldeleitung UV-Netzwächter -> Steuerung -->
  <polyline points="270,605 525,605 525,452" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="398" y="598" text-anchor="middle" font-size="10" fill="#666666">Netzausfallmeldung UV → CPS</text>

  <!-- ================= Legende ================= -->
  <rect x="60" y="690" width="430" height="165" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="75" y="712" font-size="12" font-weight="bold">Legende</text>
  <g stroke="#1a1a1a" stroke-width="1.5" fill="#ffffff">
    <circle cx="95" cy="733" r="11"/>
    <line x1="87.5" y1="725.5" x2="102.5" y2="740.5"/>
    <line x1="87.5" y1="740.5" x2="102.5" y2="725.5"/>
  </g>
  <text x="122" y="737" font-size="10.5">Sicherheitsleuchte in Dauerschaltung (DS)</text>
  <g stroke="#1a1a1a" stroke-width="1.5" fill="#ffffff">
    <circle cx="95" cy="762" r="11"/>
    <line x1="87.5" y1="754.5" x2="102.5" y2="769.5"/>
    <line x1="87.5" y1="769.5" x2="102.5" y2="754.5"/>
    <circle cx="95" cy="762" r="3.5" fill="#1a1a1a"/>
  </g>
  <text x="122" y="766" font-size="10.5">Sicherheitsleuchte in Bereitschaftsschaltung (BS)</text>
  <rect x="78" y="781" width="34" height="20" rx="2" fill="#1a7f37" stroke="#145c28"/>
  <rect x="82" y="789.5" width="11" height="3" fill="#ffffff"/>
  <polygon points="104,791 93,785.5 93,796.5" fill="#ffffff"/>
  <text x="122" y="795" font-size="10.5">Rettungszeichenleuchte mit Piktogramm (DS)</text>
  <line x1="78" y1="818" x2="112" y2="818" stroke="#1a1a1a" stroke-width="2"/>
  <text x="122" y="822" font-size="10.5">Energieleitung, Funktionserhalt E30/E90 gem. MLAR</text>
  <line x1="78" y1="842" x2="112" y2="842" stroke="#666666" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="122" y="846" font-size="10.5">Melde-/Steuerleitung (Bus / Kleinspannung)</text>

  <!-- ================= Hinweise ================= -->
  <rect x="510" y="690" width="390" height="165" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="525" y="712" font-size="12" font-weight="bold">Hinweise</text>
  <text x="525" y="733" font-size="10.5">• Endstromkreise: max. 20 Leuchten, Absicherung ≤ 6 A</text>
  <text x="537" y="748" font-size="10.5">(DIN VDE 0108-100)</text>
  <text x="525" y="766" font-size="10.5">• Nennbetriebsdauer nach Baurecht: 1 h (ggf. 3 h / 8 h)</text>
  <text x="525" y="784" font-size="10.5">• Automatische Funktions- und Betriebsdauertests,</text>
  <text x="537" y="799" font-size="10.5">Protokollierung im Prüfbuch (DIN EN 50172)</text>
  <text x="525" y="817" font-size="10.5">• CPS-Aufstellung in eigenem Raum/Brandabschnitt,</text>
  <text x="537" y="832" font-size="10.5">Zuleitungen mit Funktionserhalt nach MLAR</text>

  <!-- ================= Schriftfeld ================= -->
  <rect x="920" y="690" width="440" height="165" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="920" y1="731" x2="1360" y2="731" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="920" y1="772" x2="1360" y2="772" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="920" y1="813" x2="1360" y2="813" stroke="#1a1a1a" stroke-width="1"/>
  <text x="935" y="706" font-size="9" fill="#777777">ANLAGE</text>
  <text x="935" y="722" font-size="11" font-weight="bold">Sicherheitsbeleuchtung – Zentralbatteriesystem (CPS)</text>
  <text x="935" y="747" font-size="9" fill="#777777">PLANART</text>
  <text x="935" y="763" font-size="11">Übersichtsschaltplan (schematisch, ohne Maßstab)</text>
  <text x="935" y="788" font-size="9" fill="#777777">GRUNDLAGEN</text>
  <text x="935" y="804" font-size="10.5">DIN EN 50171 · DIN EN 50172 · DIN VDE 0108-100 · DIN EN 1838 · MLAR</text>
  <text x="935" y="829" font-size="9" fill="#777777">DATUM</text>
  <text x="935" y="845" font-size="11">05.07.2026</text>
  <text x="1120" y="829" font-size="9" fill="#777777">BLATT</text>
  <text x="1120" y="845" font-size="11">1 / 1</text>
  <text x="1230" y="829" font-size="9" fill="#777777">INDEX</text>
  <text x="1230" y="845" font-size="11">a</text>
</svg>
